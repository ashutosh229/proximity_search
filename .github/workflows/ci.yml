name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: ruff check app tests scripts
      - run: pytest tests/unit -q
      - run: pytest tests/integration tests/benchmark -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/generate_sample_data.py --out data
      - run: docker build -t proximity-search .
      - run: |
          docker run -d -p 8000:8000 --name ps proximity-search
          for i in $(seq 1 20); do curl -sf localhost:8000/ready && break || sleep 1; done
          curl -sf -X POST localhost:8000/IP/search/ -d "lat=0.5&long=0.5&cat=bank&rad=0.3&link=links.txt"
