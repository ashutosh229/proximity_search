name: ci
on: [push, pull_request]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: pip-audit -r requirements.txt
      - run: pytest tests/unit -q
      - run: pytest tests/integration tests/benchmark -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/generate_sample_data.py --out data
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - run: docker build -t "$IMAGE" .
      - run: |
          docker run -d -p 8000:8000 --name ps "$IMAGE"
          for i in $(seq 1 30); do curl -sf localhost:8000/ready && break || sleep 1; done
          curl -sf -X POST localhost:8000/IP/search/ -d "lat=0.5&long=0.5&cat=bank&rad=0.3&link=links.txt"
          curl -sf localhost:8000/metrics | head -5
      - name: Debug metrics
        if: always()
        run: |
          curl -si localhost:8000/metrics | head -60
          docker logs ps | tail -40
      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed "$IMAGE"
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"
