services:
  redis:
    build: ./redis
    restart: unless-stopped
    networks: [backend]
    volumes:
      - redis-data:/data

  api:
    build: .
    restart: unless-stopped
    expose: ["8000"]
    networks: [backend]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      EDGE_WEIGHT_MODE: ${EDGE_WEIGHT_MODE:-grid}
      DIRECTED_LINKS: ${DIRECTED_LINKS:-false}
      PRELOAD_LINKS: ${PRELOAD_LINKS:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      API_KEY: ${API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2g

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports: ["80:80"]
    networks: [backend, frontend]
    depends_on:
      api:
        condition: service_healthy

networks:
  frontend:
  backend:
    internal: true   # redis/api unreachable from the host; only nginx is published

volumes:
  redis-data:
