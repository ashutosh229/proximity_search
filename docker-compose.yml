services:
  api:
    build: .
    expose: ["8000"]
    restart: unless-stopped
    environment:
      EDGE_WEIGHT_MODE: ${EDGE_WEIGHT_MODE:-grid}
      DIRECTED_LINKS: ${DIRECTED_LINKS:-false}
      DEFAULT_LINK: ${DEFAULT_LINK:-}
      PRELOAD_LINKS: ${PRELOAD_LINKS:-link.txt}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      API_KEY: ${API_KEY:-}
      REDIS_URL: ${REDIS_URL:-}
      LOG_LEVEL: INFO
    volumes:
      - ./data:/srv/data:ro
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2g
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
