apiVersion: apps/v1
kind: Deployment
metadata: { name: proximity-search }
spec:
  replicas: 2
  selector: { matchLabels: { app: ps } }
  template:
    metadata:
      labels: { app: ps }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000" }
    spec:
      containers:
        - name: api
          image: REGISTRY/proximity-search:TAG
          ports: [{ containerPort: 8000 }]
          env:
            - { name: WEB_CONCURRENCY, value: "2" }
            - { name: PRELOAD_LINKS, value: "link.txt" }
            # - { name: REDIS_URL, value: "redis://redis:6379/0" }
            # - { name: API_KEY, valueFrom: { secretKeyRef: { name: ps-secret, key: api-key } } }
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          startupProbe:
            {
              httpGet: { path: /ready, port: 8000 },
              failureThreshold: 30,
              periodSeconds: 2,
            }
          readinessProbe:
            { httpGet: { path: /ready, port: 8000 }, periodSeconds: 5 }
          livenessProbe:
            {
              httpGet: { path: /health, port: 8000 },
              periodSeconds: 10,
              failureThreshold: 3,
            }
---
apiVersion: v1
kind: Service
metadata: { name: proximity-search }
spec:
  selector: { app: ps }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: proximity-search }
spec:
  scaleTargetRef:
    { apiVersion: apps/v1, kind: Deployment, name: proximity-search }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
